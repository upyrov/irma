openapi: 3.1.0
info:
  title: Irma API
  version: 0.1.0
  description: |
    Контракт REST API для Irma (аналог Jira): команди, проєкти, спринти, задачі, коментарі.

    **Статус.** У `Irma.WebAPI` ще немає контролерів — цей файл описує, *які* ендпоінти
    потрібні і з якими DTO вони працюють. Схеми в `components.schemas` збігаються з
    класами з `Irma.BLL/DTOs`. Схеми та ендпоінти з `x-status: planned` спираються на
    сутності з `Irma.DAL`, але відповідного DTO/поля в коді ще немає.

    **Загальні правила**
    - Базовий шлях — `/api`. Формат — JSON, `camelCase` (дефолт ASP.NET).
    - Enum'и передаються **рядками** (`"Scrum"`, `"High"`). За замовчуванням System.Text.Json
      серіалізує enum числами — потрібно додати `JsonStringEnumConverter` у `Program.cs`.
    - Дати — ISO 8601 з часовим поясом (`DateTimeOffset`), напр. `2026-11-10T00:00:00+02:00`.
    - Автентифікація — HttpOnly cookie, яку ставить `/api/auth/login`.
    - Помилки повертаються у форматі `ProblemDetails` (RFC 9457).
    - Права залежать від ролі користувача в проєкті (`ProjectRole`). У кожного ендпоінта
      вказано, хто має доступ.

    **Відомі прогалини в бекенді** (потрібно закрити до реалізації)
    1. `User` не має пароля — без `PasswordHash` неможливі `register` / `login`.
    2. `Project` не має ключа (`KAI`, `MOB`) — без нього нема з чого генерувати `IssueKey` (`KAI-12`).
    3. `ProjectDto.Members` — це `UserDto[]` без ролі; сторінці «Учасники та ролі» потрібен
       `ProjectMemberDto` (`user` + `role`).
    4. В `IssueUpdateDto` `null` означає «не змінювати», тож задачу неможливо прибрати зі
       спринту / епіка чи зняти виконавця. Потрібні окремі прапорці або окремий ендпоінт
       (див. `PATCH /api/issues/{issueId}/sprint`).
    5. Немає DTO для створення команди, оновлення проєкту й спринту — описані нижче як planned.
  contact:
    name: Irma team

servers:
  - url: http://localhost:5172
    description: Локальний запуск (`dotnet run`, профіль http)
  - url: https://localhost:7078
    description: Локальний запуск (профіль https)

security:
  - cookieAuth: []

tags:
  - name: Auth
    description: Реєстрація, вхід, вихід, поточний користувач
  - name: Users
    description: Пошук користувачів (для додавання в команду / проєкт)
  - name: Teams
    description: Команди та їхні учасники
  - name: Projects
    description: Проєкти команд
  - name: Members
    description: Учасники проєкту та їхні ролі
  - name: Stages
    description: Колонки дошки проєкту
  - name: Sprints
    description: Спринти (лише для шаблону Scrum)
  - name: Issues
    description: Задачі — беклог, спринт, дошка
  - name: Comments
    description: Коментарі до задач

paths:
  # ───────────────────────────── Auth ─────────────────────────────
  /api/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Зареєструвати користувача
      description: Створює користувача і одразу логінить його (ставить cookie).
      x-status: planned
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthRequestDto' }
      responses:
        '201':
          description: Користувача створено, cookie встановлено
          headers:
            Set-Cookie: { $ref: '#/components/headers/AuthCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDto' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Користувач з таким `username` уже існує (унікальний індекс `Users.Username`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Увійти
      x-status: planned
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthRequestDto' }
      responses:
        '200':
          description: Успішний вхід, cookie встановлено
          headers:
            Set-Cookie: { $ref: '#/components/headers/AuthCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDto' }
        '401':
          description: Неправильний логін або пароль
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Вийти
      description: Видаляє auth-cookie.
      x-status: planned
      responses:
        '204': { description: Cookie очищено }

  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Поточний користувач
      description: Фронтенд викликає при старті, щоб зрозуміти, чи користувач залогінений.
      responses:
        '200':
          description: Залогінений користувач
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────── Users ─────────────────────────────
  /api/users:
    get:
      tags: [Users]
      operationId: searchUsers
      summary: Знайти користувачів за username
      description: Для автодоповнення в полях «Додати учасника».
      parameters:
        - name: search
          in: query
          required: true
          description: Частина `username`, мінімум 2 символи
          schema: { type: string, minLength: 2 }
        - name: teamId
          in: query
          description: Шукати лише серед учасників цієї команди
          schema: { $ref: '#/components/schemas/Guid' }
      responses:
        '200':
          description: Знайдені користувачі (до 20)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────── Teams ─────────────────────────────
  /api/teams:
    get:
      tags: [Teams]
      operationId: getMyTeams
      summary: Мої команди
      description: Команди, учасником яких є поточний користувач (сайдбар «Мої команди», сторінка «Команди»).
      responses:
        '200':
          description: Список команд
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TeamDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Teams]
      operationId: createTeam
      summary: Створити команду
      description: Поточний користувач автоматично стає її учасником.
      x-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamCreateDto' }
      responses:
        '201':
          description: Команду створено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamDto' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/teams/{teamId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Teams]
      operationId: getTeam
      summary: Команда з учасниками
      responses:
        '200':
          description: Команда
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/teams/{teamId}/members:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    post:
      tags: [Teams]
      operationId: addTeamMember
      summary: Додати користувача в команду
      description: 'Доступ: будь-який учасник команди.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { $ref: '#/components/schemas/Guid' }
      responses:
        '200':
          description: Оновлена команда
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/teams/{teamId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [Teams]
      operationId: removeTeamMember
      summary: Видалити користувача з команди
      responses:
        '204': { description: Видалено }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Projects ─────────────────────────────
  /api/projects:
    get:
      tags: [Projects]
      operationId: getMyProjects
      summary: Мої проєкти
      description: Проєкти, де поточний користувач є учасником (головна сторінка, перемикач проєктів).
      responses:
        '200':
          description: Список проєктів
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProjectDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Projects]
      operationId: createProject
      summary: Створити проєкт
      description: |
        Модалка «Новий проєкт». Що робить сервер:
        - створює колонки (`Stage`) за шаблоном:
          - `Scrum` → To Do, In Progress, Done
          - `Kanban` → Backlog, Selected, In Progress, Done
          - `BugTracking` → New, Triage, In Progress, Fixed, Verified
        - додає творця в `ProjectMembers` з роллю `Owner`.

        Доступ: учасник команди `teamId`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreateDto' }
      responses:
        '201':
          description: Проєкт створено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDto' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      summary: Проєкт
      description: 'Доступ: будь-який учасник проєкту.'
      responses:
        '200':
          description: Проєкт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Змінити назву / опис проєкту
      description: 'Доступ: Owner, Admin. Шаблон після створення не змінюється.'
      x-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectUpdateDto' }
      responses:
        '200':
          description: Оновлений проєкт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDto' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Видалити проєкт
      description: 'Доступ: лише Owner. Каскадно видаляє спринти, колонки, задачі й коментарі.'
      responses:
        '204': { description: Видалено }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Members ─────────────────────────────
  /api/projects/{projectId}/members:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Members]
      operationId: getProjectMembers
      summary: Учасники проєкту з ролями
      description: 'Сторінка «Учасники та ролі». Доступ: будь-який учасник проєкту.'
      x-status: planned
      responses:
        '200':
          description: Учасники
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProjectMemberDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Members]
      operationId: addProjectMember
      summary: Додати учасника
      description: |
        Користувач має бути учасником команди проєкту. Роль `Owner` призначити не можна.

        Доступ: Owner, Admin.
      x-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectMemberCreateDto' }
      responses:
        '201':
          description: Учасника додано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMemberDto' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Користувач уже в проєкті (унікальний індекс `ProjectId + UserId`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/projects/{projectId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Members]
      operationId: changeMemberRole
      summary: Змінити роль учасника
      description: 'Роль Owner змінити не можна. Доступ: Owner, Admin.'
      x-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/AssignableRole' }
      responses:
        '200':
          description: Оновлений учасник
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMemberDto' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Members]
      operationId: removeProjectMember
      summary: Видалити учасника з проєкту
      description: |
        Owner видалити не можна. Задачі, призначені на цього користувача в проєкті,
        стають непризначеними.

        Доступ: Owner, Admin.
      x-status: planned
      responses:
        '204': { description: Видалено }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Stages ─────────────────────────────
  /api/projects/{projectId}/stages:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Stages]
      operationId: getProjectStages
      summary: Колонки дошки
      description: Відсортовані за `order`. Доступ — будь-який учасник проєкту.
      responses:
        '200':
          description: Колонки
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StageDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Sprints ─────────────────────────────
  /api/projects/{projectId}/sprints:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Sprints]
      operationId: getProjectSprints
      summary: Спринти проєкту
      description: |
        Для беклогу — `status=Planned` і `status=Active`; для дошки — `status=Active`.

        Доступ: будь-який учасник проєкту.
      parameters:
        - name: status
          in: query
          description: Фільтр за статусом; можна передати кілька (`?status=Planned&status=Active`)
          schema:
            type: array
            items: { $ref: '#/components/schemas/SprintStatus' }
          style: form
          explode: true
      responses:
        '200':
          description: Спринти, відсортовані за `startDate`
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SprintDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/sprints:
    post:
      tags: [Sprints]
      operationId: createSprint
      summary: Створити спринт
      description: |
        Кнопка «Створити спринт» у беклозі. Новий спринт має статус `Planned`.
        Назва унікальна в межах проєкту. Лише для проєктів із шаблоном `Scrum`.

        Доступ: Owner, Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SprintCreateDto' }
      responses:
        '201':
          description: Спринт створено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SprintDto' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Спринт з такою назвою вже є в проєкті
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/sprints/{sprintId}:
    parameters:
      - $ref: '#/components/parameters/SprintId'
    get:
      tags: [Sprints]
      operationId: getSprint
      summary: Спринт
      responses:
        '200':
          description: Спринт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SprintDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Sprints]
      operationId: updateSprint
      summary: Редагувати спринт
      description: 'Назва, ціль, дати. Закритий спринт редагувати не можна. Доступ: Owner, Admin.'
      x-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SprintUpdateDto' }
      responses:
        '200':
          description: Оновлений спринт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SprintDto' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Sprints]
      operationId: deleteSprint
      summary: Видалити спринт
      description: |
        Лише спринт у статусі `Planned`. Його задачі повертаються в беклог
        (`SprintId → null`, налаштовано через `OnDelete(SetNull)`).

        Доступ: Owner, Admin.
      responses:
        '204': { description: Видалено }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/sprints/{sprintId}/start:
    parameters:
      - $ref: '#/components/parameters/SprintId'
    post:
      tags: [Sprints]
      operationId: startSprint
      summary: Запустити спринт
      description: |
        Кнопка «Start Sprint»: `Planned → Active`. Якщо `startDate` / `endDate` порожні,
        сервер ставить сьогодні і +14 днів.

        Доступ: Owner, Admin.
      responses:
        '200':
          description: Спринт активний
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SprintDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: У проєкті вже є активний спринт, або спринт не в статусі `Planned`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/sprints/{sprintId}/complete:
    parameters:
      - $ref: '#/components/parameters/SprintId'
    post:
      tags: [Sprints]
      operationId: completeSprint
      summary: Завершити спринт
      description: |
        Кнопка «Завершити спринт»: `Active → Closed`. Незавершені задачі (не в останній
        колонці) переносяться в `moveOpenIssuesTo` або в беклог, якщо він `null`.

        Доступ: Owner, Admin.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                moveOpenIssuesTo:
                  description: Id запланованого спринту; `null` — у беклог
                  oneOf:
                    - $ref: '#/components/schemas/Guid'
                    - type: 'null'
      responses:
        '200':
          description: Спринт закрито
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SprintDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Спринт не в статусі `Active`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  # ───────────────────────────── Issues ─────────────────────────────
  /api/projects/{projectId}/issues:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Issues]
      operationId: getProjectIssues
      summary: Задачі проєкту з фільтрами
      description: |
        Одна точка для всіх екранів:
        - беклог (без спринту): `?backlog=true`
        - спринт у беклозі / Scrum-дошка: `?sprintId={id}`
        - Kanban-дошка: без фільтрів
        - список епіків: `?issueType=Epic`

        Решта параметрів — фільтри дошки. Доступ: будь-який учасник проєкту.
      parameters:
        - name: sprintId
          in: query
          schema: { $ref: '#/components/schemas/Guid' }
        - name: backlog
          in: query
          description: '`true` — лише задачі без спринту. Не комбінується з `sprintId`.'
          schema: { type: boolean }
        - name: stageId
          in: query
          schema: { $ref: '#/components/schemas/Guid' }
        - name: epicId
          in: query
          schema: { $ref: '#/components/schemas/Guid' }
        - name: assigneeId
          in: query
          description: Можна кілька (фільтр аватарками). `me` — поточний користувач («Тільки мої»).
          schema:
            type: array
            items:
              oneOf:
                - $ref: '#/components/schemas/Guid'
                - type: string
                  const: me
          style: form
          explode: true
        - name: issueType
          in: query
          schema: { $ref: '#/components/schemas/IssueType' }
        - name: search
          in: query
          description: Пошук за `title` і `issueKey` (без урахування регістру)
          schema: { type: string }
      responses:
        '200':
          description: Задачі, відсортовані за `createdAt`
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IssueDto' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Issues]
      operationId: createIssue
      summary: Створити задачу
      description: |
        Швидке створення в беклозі, «Створити задачу» в колонці дошки, модалка задачі.
        Сервер генерує `issueKey` (`{ключ проєкту}-{N}`) і `createdAt`.
        `stageId` має належати цьому проєкту; `epicId` — задачі з `issueType = Epic`.

        Доступ: Owner, Admin, Member.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueCreateDto' }
      responses:
        '201':
          description: Задачу створено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueDto' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/issues/{issueId}:
    parameters:
      - $ref: '#/components/parameters/IssueId'
    get:
      tags: [Issues]
      operationId: getIssue
      summary: Задача
      description: Модалка задачі.
      responses:
        '200':
          description: Задача
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Issues]
      operationId: updateIssue
      summary: Оновити задачу
      description: |
        Часткове оновлення: поля, яких немає в тілі або які дорівнюють `null`, не змінюються.
        Перетягування на дошці — `{ "stageId": "..." }`.

        ⚠️ Через семантику `null` цим ендпоінтом не можна прибрати задачу зі спринту /
        епіка чи зняти виконавця — для спринту див. `PATCH /api/issues/{issueId}/sprint`.

        Доступ: Owner, Admin, Member.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueUpdateDto' }
      responses:
        '200':
          description: Оновлена задача
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueDto' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Issues]
      operationId: deleteIssue
      summary: Видалити задачу
      description: |
        Каскадно видаляє коментарі. Якщо це епік — у його задач `epicId → null`.

        Доступ: Owner, Admin.
      responses:
        '204': { description: Видалено }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/issues/{issueId}/sprint:
    parameters:
      - $ref: '#/components/parameters/IssueId'
    patch:
      tags: [Issues]
      operationId: moveIssueToSprint
      summary: Перенести задачу в спринт або в беклог
      description: |
        Drag'n'drop між секціями беклогу. `sprintId: null` — повернути в беклог.
        Не можна переносити в закритий спринт.

        Доступ: Owner, Admin, Member.
      x-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sprintId]
              properties:
                sprintId:
                  oneOf:
                    - $ref: '#/components/schemas/Guid'
                    - type: 'null'
      responses:
        '200':
          description: Оновлена задача
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────── Comments ─────────────────────────────
  /api/issues/{issueId}/comments:
    parameters:
      - $ref: '#/components/parameters/IssueId'
    get:
      tags: [Comments]
      operationId: getIssueComments
      summary: Коментарі задачі
      description: Від старих до нових. Доступ — будь-який учасник проєкту.
      responses:
        '200':
          description: Коментарі
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CommentDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Comments]
      operationId: addComment
      summary: Додати коментар
      description: 'Автор — поточний користувач. Доступ: Owner, Admin, Member.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentCreateDto' }
      responses:
        '201':
          description: Коментар створено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentDto' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/comments/{commentId}:
    parameters:
      - name: commentId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Guid' }
    delete:
      tags: [Comments]
      operationId: deleteComment
      summary: Видалити коментар
      description: 'Доступ: автор коментаря, Owner, Admin.'
      responses:
        '204': { description: Видалено }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: irma_auth
      description: HttpOnly, Secure, SameSite=Lax cookie, яку ставить `/api/auth/login`.

  headers:
    AuthCookie:
      description: '`irma_auth=<token>; HttpOnly; Secure; SameSite=Lax; Path=/`'
      schema: { type: string }

  parameters:
    TeamId:
      name: teamId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Guid' }
    UserId:
      name: userId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Guid' }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Guid' }
    SprintId:
      name: sprintId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Guid' }
    IssueId:
      name: issueId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Guid' }

  responses:
    ValidationError:
      description: Тіло запиту не пройшло валідацію
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblemDetails' }
    Unauthorized:
      description: Користувач не залогінений (немає або протермінована cookie)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Forbidden:
      description: Немає доступу — не учасник проєкту / команди або недостатня роль
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFound:
      description: Ресурс не знайдено
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Conflict:
      description: Операція суперечить поточному стану (дубль, неправильний статус)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

  schemas:
    Guid:
      type: string
      format: uuid
      example: 3fa85f64-5717-4562-b3fc-2c963f66afa6

    # ── Enums (Irma.DAL/Enums) ──
    ProjectTemplate:
      type: string
      enum: [Scrum, Kanban, BugTracking]
    ProjectRole:
      type: string
      enum: [Owner, Admin, Member, Viewer]
      description: |
        - **Owner** — усе, включно з видаленням проєкту. Один на проєкт.
        - **Admin** — учасники, ролі, спринти, видалення задач.
        - **Member** — створення / редагування задач, коментарі.
        - **Viewer** — лише перегляд.
    AssignableRole:
      type: string
      enum: [Admin, Member, Viewer]
      description: Ролі, які можна призначити (без Owner)
    SprintStatus:
      type: string
      enum: [Planned, Active, Closed]
    IssueType:
      type: string
      enum: [Epic, Story, Task, Bug]
    Priority:
      type: string
      enum: [Highest, High, Medium, Low, Lowest]

    # ── Auth ──
    AuthRequestDto:
      x-status: planned
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 100, example: artem.b }
        password: { type: string, format: password, minLength: 8 }

    # ── Irma.BLL/DTOs ──
    UserDto:
      type: object
      required: [id, username]
      properties:
        id: { $ref: '#/components/schemas/Guid' }
        username: { type: string, maxLength: 100, example: artem.b }

    TeamDto:
      type: object
      required: [id, name, members]
      properties:
        id: { $ref: '#/components/schemas/Guid' }
        name: { type: string, maxLength: 200, example: Команда КАІ }
        members:
          type: array
          items: { $ref: '#/components/schemas/UserDto' }

    TeamCreateDto:
      x-status: planned
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }

    ProjectDto:
      type: object
      required: [id, name, template, teamId, members]
      properties:
        id: { $ref: '#/components/schemas/Guid' }
        name: { type: string, maxLength: 200, example: Jira-аналог (курсова) }
        description: { type: [string, 'null'], maxLength: 2000 }
        template: { $ref: '#/components/schemas/ProjectTemplate' }
        teamId: { $ref: '#/components/schemas/Guid' }
        members:
          type: array
          description: Зараз без ролей — див. прогалину №3 і `ProjectMemberDto`
          items: { $ref: '#/components/schemas/UserDto' }

    ProjectCreateDto:
      type: object
      required: [name, teamId, template]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 2000 }
        teamId: { $ref: '#/components/schemas/Guid' }
        template: { $ref: '#/components/schemas/ProjectTemplate' }

    ProjectUpdateDto:
      x-status: planned
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 2000 }

    ProjectMemberDto:
      x-status: planned
      type: object
      required: [user, role]
      properties:
        user: { $ref: '#/components/schemas/UserDto' }
        role: { $ref: '#/components/schemas/ProjectRole' }
        issueCount:
          type: integer
          description: Скільки задач проєкту призначено на учасника (колонка «Задач»)

    ProjectMemberCreateDto:
      x-status: planned
      type: object
      required: [userId, role]
      properties:
        userId: { $ref: '#/components/schemas/Guid' }
        role: { $ref: '#/components/schemas/AssignableRole' }

    StageDto:
      type: object
      required: [id, name, order, projectId]
      properties:
        id: { $ref: '#/components/schemas/Guid' }
        name: { type: string, maxLength: 200, example: In Progress }
        order:
          type: integer
          description: Позиція колонки зліва направо; унікальна в межах проєкту
        projectId: { $ref: '#/components/schemas/Guid' }

    SprintDto:
      type: object
      required: [id, name, status, projectId]
      properties:
        id: { $ref: '#/components/schemas/Guid' }
        name: { type: string, maxLength: 200, example: Спринт 2 }
        goal: { type: [string, 'null'], maxLength: 1000 }
        startDate: { type: [string, 'null'], format: date-time }
        endDate: { type: [string, 'null'], format: date-time }
        status: { $ref: '#/components/schemas/SprintStatus' }
        projectId: { $ref: '#/components/schemas/Guid' }

    SprintCreateDto:
      type: object
      required: [name, projectId]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        goal: { type: [string, 'null'], maxLength: 1000 }
        startDate: { type: [string, 'null'], format: date-time }
        endDate:
          type: [string, 'null']
          format: date-time
          description: Має бути пізніше за `startDate`
        projectId: { $ref: '#/components/schemas/Guid' }

    SprintUpdateDto:
      x-status: planned
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        goal: { type: [string, 'null'], maxLength: 1000 }
        startDate: { type: [string, 'null'], format: date-time }
        endDate: { type: [string, 'null'], format: date-time }

    IssueDto:
      type: object
      required: [id, issueKey, title, issueType, priority, stageId, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Guid' }
        issueKey:
          type: string
          maxLength: 50
          description: Унікальний, генерується сервером
          example: KAI-12
        title: { type: string, maxLength: 300 }
        description: { type: [string, 'null'], maxLength: 4000 }
        issueType: { $ref: '#/components/schemas/IssueType' }
        priority: { $ref: '#/components/schemas/Priority' }
        storyPoints: { type: [integer, 'null'], minimum: 0 }
        assignee:
          oneOf:
            - $ref: '#/components/schemas/UserDto'
            - type: 'null'
        stageId: { $ref: '#/components/schemas/Guid' }
        sprintId:
          description: '`null` — задача в беклозі'
          oneOf:
            - $ref: '#/components/schemas/Guid'
            - type: 'null'
        epicId:
          oneOf:
            - $ref: '#/components/schemas/Guid'
            - type: 'null'
        createdAt: { type: string, format: date-time }

    IssueCreateDto:
      type: object
      required: [title, issueType, priority, stageId]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: [string, 'null'], maxLength: 4000 }
        issueType: { $ref: '#/components/schemas/IssueType' }
        priority: { $ref: '#/components/schemas/Priority' }
        storyPoints: { type: [integer, 'null'], minimum: 0 }
        assigneeId:
          description: Має бути учасником проєкту
          oneOf:
            - $ref: '#/components/schemas/Guid'
            - type: 'null'
        stageId:
          description: Зазвичай перша колонка проєкту
          allOf:
            - $ref: '#/components/schemas/Guid'
        sprintId:
          description: '`null` — у беклог'
          oneOf:
            - $ref: '#/components/schemas/Guid'
            - type: 'null'
        epicId:
          oneOf:
            - $ref: '#/components/schemas/Guid'
            - type: 'null'

    IssueUpdateDto:
      type: object
      description: Усі поля необов'язкові; `null` / відсутнє поле = не змінювати. `issueType` змінити не можна.
      properties:
        title: { type: [string, 'null'], minLength: 1, maxLength: 300 }
        description: { type: [string, 'null'], maxLength: 4000 }
        priority:
          oneOf:
            - $ref: '#/components/schemas/Priority'
            - type: 'null'
        storyPoints: { type: [integer, 'null'], minimum: 0 }
        assigneeId:
          oneOf:
            - $ref: '#/components/schemas/Guid'
            - type: 'null'
        stageId:
          oneOf:
            - $ref: '#/components/schemas/Guid'
            - type: 'null'
        sprintId:
          oneOf:
            - $ref: '#/components/schemas/Guid'
            - type: 'null'
        epicId:
          oneOf:
            - $ref: '#/components/schemas/Guid'
            - type: 'null'

    CommentDto:
      type: object
      required: [id, text, author, createdAt, issueId]
      properties:
        id: { $ref: '#/components/schemas/Guid' }
        text: { type: string, maxLength: 4000 }
        author: { $ref: '#/components/schemas/UserDto' }
        createdAt: { type: string, format: date-time }
        issueId: { $ref: '#/components/schemas/Guid' }

    CommentCreateDto:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 4000 }

    # ── Помилки ──
    ProblemDetails:
      type: object
      properties:
        type: { type: string, example: 'https://tools.ietf.org/html/rfc9110#section-15.5.5' }
        title: { type: string, example: Not Found }
        status: { type: integer, example: 404 }
        detail: { type: string, example: Проєкт не знайдено }
        traceId: { type: string }

    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            errors:
              type: object
              description: Поле → список помилок
              additionalProperties:
                type: array
                items: { type: string }
              example:
                Title: ['The Title field is required.']
